name: Install Linux build dependencies
description: >
  Installs the system packages that eframe, wgpu, and the native file
  dialogs link against when building RasterLab on Ubuntu runners.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libgtk-3-dev \
          pkg-config
